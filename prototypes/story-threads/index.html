<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Story Threads — Prototypes</title>
<link rel="stylesheet" href="../../ap-design-tokens.css" />
<link rel="stylesheet" href="../../ap-text-styles.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--ap-font-family);
    background: var(--ap-color-backgrounds-secondary);
    color: var(--ap-color-text-primary);
    min-height: 100vh;
  }

  .page-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--ap-layout-size-64) var(--ap-layout-size-24);
  }

  .ap-logo {
    width: 40px;
    height: auto;
    margin-bottom: var(--ap-layout-size-32);
  }

  .page-title {
    font-size: var(--ap-text-size-x3);
    font-weight: var(--ap-font-weight-bold);
    font-stretch: var(--ap-font-stretch-condensed);
    line-height: 1.15;
    margin-bottom: var(--ap-spacing-300);
  }

  .page-desc {
    font-size: var(--ap-text-size-body-sm);
    color: var(--ap-color-text-secondary);
    line-height: 1.6;
    margin-bottom: var(--ap-spacing-700);
  }

  .link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
  }

  .link-list li {
    border-bottom: 1px solid var(--ap-color-elements-border-subtle);
  }

  .link-list li:first-child {
    border-top: 1px solid var(--ap-color-elements-border-subtle);
  }

  .link-list a {
    display: block;
    padding: var(--ap-spacing-500) var(--ap-spacing-100);
    font-size: var(--ap-text-size-body-base);
    font-weight: var(--ap-font-weight-bold);
    font-stretch: var(--ap-font-stretch-semi-condensed);
    color: var(--ap-color-text-primary);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .link-list a:hover {
    color: var(--ap-color-interactive-text-link-enabled);
  }

  .link-list a:focus-visible {
    outline: 2px solid var(--ap-color-interactive-text-link-enabled);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <div class="page-wrap">

    <img class="ap-logo" src="../../images/ap-logo.png" alt="AP Logo" />

    <h1 class="page-title">Story Threads</h1>
    <p class="page-desc">Prototypes exploring how readers follow ongoing stories — accounts, article follow states, timelines, and hub pages.</p>

    <ul class="link-list">
      <li><a href="account-following.html">Account Following</a></li>
      <li><a href="article-follow.html">Article Follow</a></li>
      <li><a href="article-timeline.html">Article Timeline</a></li>
      <li><a href="hub-tour-de-france.html">Hub Tour de France</a></li>
      <li><a href="story-thread-cyclospora.html">Story Thread Cyclospora</a></li>
    </ul>

  </div>

</body>
</html>
